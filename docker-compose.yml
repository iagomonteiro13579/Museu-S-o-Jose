services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - APP_ORIGIN=${APP_ORIGIN}
      - UPLOAD_DIR=/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    volumes:
      - uploads_data:/app/uploads
      - ./dados_acervo:/app/dados_acervo
    restart: unless-stopped
    networks:
      - museu_network
  mysql:
    image: mysql:8.0
    container_name: my_mysql_site
    environment:
      - MYSQL_ROOT_PASSWORD=${MY_SECRET_PW}
      - MYSQL_DATABASE=${MY_DATABASE}
      - MYSQL_PASSWORD=${MY_SECRET_PW}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MY_SECRET_PW}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - museu_network
networks:
  museu_network:
    driver: bridge

volumes:
  uploads_data:
  db_data:
