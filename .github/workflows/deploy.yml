name: Deploy on New Tag

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
    - name: Execute SSH Commands
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.HOST }}
        username: siteextensao
        key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /home/siteextensao/ProjetoMuseu
            git fetch origin ${{ github.sha }}
            git checkout --detach ${{ github.sha }}
            mkdir -p backups
            sudo docker compose build
            sudo docker compose exec -T mysql sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' > "backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql"
            sudo docker compose run --rm app npx prisma migrate deploy
            sudo docker compose up -d --remove-orphans
            for attempt in $(seq 1 24); do
              if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
              sleep 5
            done
            sudo docker compose logs --tail=100 app
            exit 1
